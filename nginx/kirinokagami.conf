# KirinoKagami - example nginx reverse proxy.
#
# Install:
#   1. Copy to /etc/nginx/conf.d/kirinokagami.conf (or sites-available + symlink).
#   2. Replace mirror.example.com and the certificate paths below.
#      (certbot: certbot certonly --nginx -d mirror.example.com)
#   3. nginx -t && systemctl reload nginx
#
# Behind Cloudflare (orange cloud):
#   - Set SSL/TLS mode to "Full (strict)". "Flexible" makes Cloudflare talk to
#     port 80, which redirects to HTTPS -> endless 301 redirect loop.
#   - A Cloudflare Origin Certificate (SSL/TLS -> Origin Server) works as the
#     certificate below; certbot isn't needed.
#   - Also install cloudflare-realip.conf so rate limits see visitor IPs.
#
# The mirror is expected on 127.0.0.1:62011. With Docker, publish it on
# localhost only so it can't be reached around nginx:
#   ports: ["127.0.0.1:62011:62011"]
#
# This file is included inside nginx's http {} block, which is where the
# upstream and limit_req_zone directives below have to live.

upstream kirinokagami {
    server 127.0.0.1:62011;
    keepalive 32;
}

# Per-IP request limits. Cached .osz files are cheap to serve; uncached ones
# make the mirror download from osu!, so downloads get a tighter limit.
limit_req_zone $binary_remote_addr zone=kirino_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=kirino_dl:10m  rate=2r/s;

# Redirect plain HTTP to HTTPS (keeps the ACME challenge path working).
server {
    listen 80;
    listen [::]:80;
    server_name mirror.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # "listen ... ssl http2" works on every nginx version. On nginx >= 1.25.1
    # it prints a deprecation warning; you can switch to "listen 443 ssl;"
    # plus a separate "http2 on;" line there.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mirror.example.com;

    ssl_certificate     /etc/letsencrypt/live/mirror.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mirror.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:kirino_ssl:10m;

    access_log /var/log/nginx/kirinokagami.access.log;
    error_log  /var/log/nginx/kirinokagami.error.log warn;

    # Requests are all GETs with query strings; nothing large is uploaded.
    client_max_body_size 16k;

    # Shared proxy settings.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    limit_req_status 429;

    # --- metadata + search: /api/b /api/md5 /api/s /api/search /api/status ---
    location /api/ {
        limit_req zone=kirino_api burst=40 nodelay;
        proxy_pass http://kirinokagami;
        # A set that isn't in the database yet is fetched from osu! on demand.
        proxy_read_timeout 30s;
        gzip on;
        gzip_types application/json;
        gzip_min_length 1024;
    }

    location = /api {
        proxy_pass http://kirinokagami;
    }

    # --- downloads: /d/{id} and /d/{id}n ---
    location /d/ {
        limit_req zone=kirino_dl burst=10 nodelay;
        proxy_pass http://kirinokagami;
        # The first request for a set waits while the mirror downloads it from
        # osu! (up to downloads.timeout, default 5m), so allow plenty of time.
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
        # Stream archives straight through instead of buffering them to disk;
        # range requests (resumed downloads) are passed through as-is.
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # --- admin: only reachable from this machine ---
    # Call it locally with: curl -X POST -H "Authorization: Bearer $TOKEN" http://127.0.0.1:62011/admin/...
    # To allow it through nginx from specific addresses, add "allow x.x.x.x;"
    # lines above "deny all;".
    location /admin/ {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://kirinokagami;
        proxy_read_timeout 60s;
    }

    # --- index page ---
    location = / {
        proxy_pass http://kirinokagami;
    }

    # Anything else isn't served by the mirror.
    location / {
        return 404;
    }
}
