<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  // Apply a saved theme before the page is drawn (light is the default).
  try { if (localStorage.getItem('kirino-theme') === 'dark') document.documentElement.dataset.theme = 'dark'; } catch {}
</script>
<title>{{.Title}}</title>
<link rel="stylesheet" href="/static/app.css?v={{.Version}}">
{{if .LogoURL}}<link rel="icon" href="{{.LogoURL}}" type="{{.LogoType}}">{{else}}<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23f0a64a'/%3E%3Cstop offset='.7' stop-color='%23d63f7a'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='16' cy='16' r='14' fill='url(%23g)'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='white' stroke-width='3'/%3E%3C/svg%3E">{{end}}
</head>
<body data-cover-base="{{.CoverBaseURL}}" data-preview-pattern="{{.PreviewURL}}" data-downloads="{{.DownloadsEnabled}}">

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="/" aria-label="{{.Title}} home">
      {{if .LogoURL}}<img class="brand-logo" src="{{.LogoURL}}" alt="">{{else}}<span class="brand-mark" aria-hidden="true"></span>{{end}}
      <span class="brand-name">{{.Title}}</span>
    </a>
    <form class="search" role="search" id="search-form">
      <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
      <input id="q" type="search" name="q" placeholder="Search title, artist, mapper, tags…" autocomplete="off" spellcheck="false" aria-label="Search beatmaps">
    </form>
    <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Switch to dark mode" title="Switch to dark mode">
      <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>
  <div class="filters">
    <div class="chip-group" role="radiogroup" aria-label="Ranked status" id="status-filter">
      <button type="button" role="radio" data-value="any">Any</button>
      <button type="button" role="radio" data-value="ranked">Ranked</button>
      <button type="button" role="radio" data-value="qualified">Qualified</button>
      <button type="button" role="radio" data-value="loved">Loved</button>
      <button type="button" role="radio" data-value="pending">Pending</button>
      <button type="button" role="radio" data-value="graveyard">Graveyard</button>
    </div>
    <div class="chip-group" role="radiogroup" aria-label="Game mode" id="mode-filter">
      <button type="button" role="radio" data-value="-1">All modes</button>
      <button type="button" role="radio" data-value="0">osu!</button>
      <button type="button" role="radio" data-value="1">taiko</button>
      <button type="button" role="radio" data-value="2">catch</button>
      <button type="button" role="radio" data-value="3">mania</button>
    </div>
  </div>
</header>

<main class="content">
  <p class="summary" id="summary" aria-live="polite"></p>
  <div class="grid" id="results"></div>
  <div class="feed-status" id="feed-status" aria-live="polite"></div>
</main>

<footer class="footer">
  <p class="footer-stats" id="footer-stats"></p>
  <a class="github-link" href="https://github.com/Rednd/KirinoKagami" target="_blank" rel="noopener noreferrer">
    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
    <span>View on GitHub</span>
  </a>
</footer>

<dialog class="detail" id="detail" aria-labelledby="detail-title"></dialog>

<script src="/static/app.js?v={{.Version}}" defer></script>
</body>
</html>
